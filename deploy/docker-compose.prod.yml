# Production stack built on the server from the git clone (deploy/deploy.sh). Settings: deploy/.env.
# Memory limits fit a 2 GB server. Files are stored in the api_uploads volume; for external S3
# set STORAGE_MODE=s3 and S3_* in deploy/.env. Only Caddy is exposed.
name: loghr

x-db-url: &db-url postgresql://${POSTGRES_USER:-loghr}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loghr}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loghr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loghr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loghr}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 96M

  migrate:
    image: loghr-api:latest
    pull_policy: never
    env_file: .env
    environment:
      DATABASE_URL: *db-url
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/init-prod.cjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: loghr-api:latest
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      WEB_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - api_uploads:/app/apps/api/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: loghr-worker:latest
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    pull_policy: build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *db-url
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  web:
    image: loghr-web:latest
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls.caddy:/etc/caddy/tls.caddy:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 64M

  metabase:
    profiles: ["bi"]
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${POSTGRES_DB:-loghr}
      MB_DB_USER: ${POSTGRES_USER:-loghr}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  caddy_data:
  caddy_config:
