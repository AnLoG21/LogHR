name: CI & Deploy

# The server deploys itself: loghr-deploy.timer polls origin/main and runs deploy/deploy.sh.
# For servers reachable from the internet, the optional "trigger" job runs it right away over SSH.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @skillaz/shared
      - run: npm run prisma:generate -w @skillaz/api
      - run: npm run build -w @skillaz/api
      - run: npx tsc --noEmit -p apps/web

  trigger:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Server polls GitHub itself
        if: env.HAS_SERVER != 'true'
        run: echo "::notice::No DEPLOY_HOST secret — the server picks up this commit via loghr-deploy.timer within ~2 minutes."
      - name: Deploy now over SSH
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 45m
          script: ${{ secrets.DEPLOY_PATH || '/opt/loghr' }}/deploy/deploy.sh
